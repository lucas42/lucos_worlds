version: 2.1
orbs:
  lucos: lucos/deploy@0
jobs:
  test-oidc-es256:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Run ES256 OIDC integration test
          # Drives the full login flow end-to-end against the real, patched
          # BookStack image + a mock ES256-only OIDC provider. This is the
          # load-bearing check from lucas42/lucos_worlds#26 — a future
          # Dependabot BookStack version-bump PR must fail here (not just
          # build) if it silently breaks the ES256 patch.
          #
          # Uses build-and-run.sh (a two-stage docker build), not a bare
          # `docker compose up --build` — setup_remote_docker runs the Docker
          # daemon on a separate remote host with no access to this job's
          # checked-out files, so a docker-compose bind-mount (the original
          # approach) silently resolves to an empty directory there.
          command: |
            cd test/oidc-es256
            ./build-and-run.sh
  test-oidc-alg-binding:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Run OIDC key-selection/alg-binding unit test
          # Unit-level coverage for lucas42/lucos_worlds#29 (hardening
          # follow-up to #26/#28): OidcJwtWithClaims::validateTokenSignature()
          # binds candidate key selection to the token's declared alg, for
          # both key shapes (JWK-array discovery keys and the file:// manual
          # config path). No mock IdP or docker-compose stack needed here —
          # just the real, patched image's own vendored PHPUnit + phpseclib3.
          command: |
            cd test/unit-oidc-alg-binding
            ./build-and-run.sh
  test-info-endpoint:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Run /_info payload-mapping unit test
          # Unit-level coverage for lucas42/lucos_worlds#6:
          # InfoController::buildPayload() maps BookStack's
          # database/cache/session health into the lucos /_info schema. No
          # mock IdP or docker-compose stack needed here — just the real
          # image's own vendored PHPUnit against InfoController.php exactly
          # as shipped. The request-time wiring (route registration + live
          # health checks against the real app/DB) is covered separately by
          # test-oidc-es256, which asserts the live /_info response
          # alongside its OIDC login checks.
          command: |
            cd test/unit-info-endpoint
            ./build-and-run.sh
  test-page-excerpt:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Run Page::getExcerpt() first-line unit test
          # Unit-level coverage for lucas42/lucos_worlds#52:
          # Page::getExcerpt() stops at the first newline in the page's
          # auto-derived text before truncating, so a summary paragraph
          # followed by a list/table doesn't bleed into the excerpt/
          # og:description. No mock IdP or docker-compose stack needed here
          # — just the real, patched image's own vendored PHPUnit.
          command: |
            cd test/unit-page-excerpt
            ./build-and-run.sh
workflows:
  version: 2
  build-deploy:
    jobs:
      - test-oidc-es256
      - test-oidc-alg-binding
      - test-info-endpoint
      - test-page-excerpt
      - lucos/build:
          serial-group: << pipeline.project.slug >>/build/<< pipeline.git.branch >>
      - lucos/deploy-avalon:
          serial-group: deploy-avalon
          requires:
            - test-oidc-es256
            - test-oidc-alg-binding
            - test-info-endpoint
            - test-page-excerpt
            - lucos/build
          filters:
            branches:
              only:
                - main
